{% extends "base.html" %}
{% import "_icons.html" as i %}
{% block titel %}Rezept wählen{% endblock %}
{% block inhalt %}
{% set aktiv_schritt = 2 %}{% include "_schritte.html" %}
<div class="seitenkopf">
  <div>
    <h1>Was möchtest du tun?</h1>
    <p class="untertitel">Zielsystem: <strong>{{ ziel_anzeige[ziel] }}</strong> · <a href="{{ basis }}/rezepte">ändern</a></p>
  </div>
</div>
<form class="suche" role="search" action="{{ basis }}/rezepte" method="get"
      hx-get="{{ basis }}/rezepte" hx-target="#rezeptliste" hx-trigger="input changed delay:300ms from:#suchfeld, change from:#kategorie, submit"
      hx-push-url="true">
  <input type="hidden" name="ziel" value="{{ ziel.value }}">
  <label class="sr-only" for="suchfeld">Suche</label>
  <input id="suchfeld" type="search" name="q" value="{{ q }}" placeholder="Suchen, z. B. Drucker, Netzwerk, Update …" autocomplete="off">
  <label class="sr-only" for="kategorie">Kategorie</label>
  <select id="kategorie" name="kategorie">
    <option value="">Alle Kategorien</option>
    {% for k in kategorien %}<option value="{{ k }}" {% if k == kategorie %}selected{% endif %}>{{ k }}</option>{% endfor %}
  </select>
  <noscript><button type="submit" class="knopf">Suchen</button></noscript>
</form>
<div id="rezeptliste">{% include "_rezeptliste.html" %}</div>
{% endblock %}
