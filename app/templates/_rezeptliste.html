{% if rezepte %}
<ul class="karten">
  {% for r in rezepte %}
  <li>
    <a class="karte" href="{{ basis }}/rezepte/{{ r.id }}?ziel={{ ziel.value }}">
      <span class="karte-kategorie">{{ r.kategorie }}</span>
      <span class="karte-titel">{{ r.name }}</span>
      <span class="karte-text">{{ r.beschreibung }}</span>
    </a>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="leer">Kein passendes Rezept gefunden. Versuch es mit einem anderen Suchbegriff.</p>
{% endif %}
