# nginx-Reverse-Proxy für den okm Script-Baukasten
# Nach /etc/nginx/sites-available/ kopieren, Servername und Zertifikate anpassen.
server {
    listen 80;
    server_name baukasten.okm.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name baukasten.okm.local;

    ssl_certificate     /etc/ssl/okm/baukasten.crt;
    ssl_certificate_key /etc/ssl/okm/baukasten.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Statische Dateien direkt ausliefern (optional, entlastet uvicorn)
    location /static/ {
        alias /opt/script-baukasten/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
