id: netzwerkproblem_diagnostizieren
name: Netzwerkproblem diagnostizieren
kategorie: Netzwerk
beschreibung: Prüft Schritt für Schritt Netzwerkeinstellungen, Router, Internet, Namensauflösung und ob ein bestimmter Server erreichbar ist (Ping, Traceroute, Port).
hilfe: Das Script ändert nichts am Rechner. Die Ausgabe kann an den Support weitergegeben werden.
schlagworte: [internet, netzwerk, verbindung, ping, langsam, keine verbindung, wlan, lan, dns, router]
felder:
  - id: ziel
    label: Welcher Server ist nicht erreichbar?
    typ: ip_oder_hostname
    beispiel: intranet.okm.local
  - id: port
    label: Port des Dienstes (443 = Webseite)
    typ: port
    standard: 443
schritte:
  - block: ip_konfiguration
  - block: gateway_ping
    nur_fuer: [powershell, bash, zsh]
  - block: ping
    parameter: {ziel: 1.1.1.1, anzahl: 2}
  - block: dns_test
    parameter: {name: www.microsoft.com}
  - block: ping
    parameter: {ziel: $ziel, anzahl: 4}
  - block: traceroute
    parameter: {ziel: $ziel}
  - block: port_pruefen
    parameter: {ziel: $ziel, port: $port}
    nur_fuer: [powershell, bash, zsh]
