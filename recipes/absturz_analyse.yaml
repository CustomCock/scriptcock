    nur_fuer: [powershell]
  - block: unerwartete_neustarts
    nur_fuer: [powershell]
  - block: absturzende_programme
    nur_fuer: [powershell]
  - block: kernel_fehler
    nur_fuer: [bash]
  - block: systemlog_fehler
    nur_fuer: [bash]
