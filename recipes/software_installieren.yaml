id: software_installieren
name: Software installieren
kategorie: Software
beschreibung: Installiert ein Programm über den Paketmanager des Betriebssystems.
hilfe: Nur freigegebene Software installieren. Die Paket-ID findest du im Software-Katalog (Knopf oben rechts).
schlagworte: [installieren, programm, software, winget, apt, brew, flatpak]
felder:
  - id: paket
    label: Paketname bzw. Paket-ID
    typ: paketname
    beispiel: Mozilla.Firefox
  - id: paketmanager
    label: Paketmanager
    typ: auswahl
    standard: standard
    optionen:
      - wert: standard
        label: "Standard (Windows: winget, Linux: apt, macOS: brew)"
      - wert: winget
        label: winget (Windows)
      - wert: apt
        label: "apt (Linux: Debian, Ubuntu)"
      - wert: dnf
        label: "dnf (Linux: Fedora, RHEL, Rocky)"
      - wert: flatpak
        label: Flatpak (Linux, Flathub)
      - wert: brew
        label: brew – Formel (macOS)
      - wert: brew_cask
        label: brew --cask – App (macOS)
schritte:
  - block: paket_installieren
    parameter: {paket: $paket, paketmanager: $paketmanager}
