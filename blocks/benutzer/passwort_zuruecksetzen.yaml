id: passwort_zuruecksetzen
version: 1
name: Passwort eines lokalen Benutzers zurücksetzen
kategorie: Benutzer
beschreibung: Setzt das Passwort eines lokalen Kontos neu. Das neue Passwort wird beim Ausführen abgefragt und steht nie im Script.
risiko: rot
interaktiv: true
fortschritt: "Passwort von {{ benutzer }} wird zurückgesetzt"
rechte:
  powershell: admin
  cmd: admin
  bash: root
  zsh: root
parameter:
  - id: benutzer
    label: Benutzername
    typ: benutzername
    beispiel: max.mustermann
ziele:
  powershell: |
    $okmPasswort = Read-Host -AsSecureString ('Neues Passwort für ' + {{ benutzer }})
    Set-LocalUser -Name {{ benutzer }} -Password $okmPasswort{{ whatif }}
    Write-Host 'Passwort gesetzt.'
  cmd: |
    echo Bitte das neue Passwort zweimal eingeben:
    net user {{ benutzer }} *
  bash: |
    {{ sudo }}passwd {{ benutzer }}
  zsh: |
    printf '%s\n' 'Bitte das neue Passwort eingeben:'
    {{ sudo }}dscl . -passwd /Users/{{ benutzer }}
hinweise:
  zsh: Achtung macOS – der Schlüsselbund des Benutzers wird dabei nicht geändert und muss ggf. neu angelegt werden.
