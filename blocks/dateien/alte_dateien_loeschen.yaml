id: alte_dateien_loeschen
version: 1
name: Alte Dateien löschen
kategorie: Dateien
beschreibung: Löscht in einem Ordner (mit Unterordnern) alle Dateien, die seit einer Anzahl Tage nicht geändert wurden – optional nur passend zu einem Muster wie *.log. Zeigt vorher Anzahl und Beispiele.
hilfe: |
  Tipp: Erst mit „Alte Dateien finden“ oder „Nur simulieren“ prüfen. Ordner selbst bleiben stehen.
  Geschützt sind Laufwerke/Wurzel, Systemordner und das Benutzerverzeichnis selbst.
risiko: rot
fortschritt: "Dateien älter als {{ tage }} Tage in {{ pfad }} werden gelöscht"
tipp: Gibt es den Ordner, und sind die Dateien nicht gerade geöffnet?
parameter:
  - id: pfad
    label: Ordner
    typ: pfad
    beispiel: C:\Logs
  - id: tage
    label: Älter als (Tage)
    typ: tage
    standard: 90
  - id: muster
    label: Nur Dateien wie (optional)
    typ: dateimuster
    pflicht: false
    beispiel: "*.log"
rueckgabe:
  - id: anzahl
    typ: zahl
    beschreibung: Anzahl der gelöschten Dateien
    ziele: [powershell, bash, zsh]
ziele:
  powershell: |
    if (-not (Test-Path -LiteralPath {{ pfad }} -PathType Container)) { throw 'Den Ordner gibt es nicht.' }
    $okmVoll = (Get-Item -LiteralPath {{ pfad }} -Force).FullName.TrimEnd('\')
    $okmGeschuetzt = @($env:SystemRoot, $env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:ProgramData, $env:USERPROFILE, (Join-Path $env:SystemDrive 'Users'))
    if ($okmVoll -match '^[A-Za-z]:$' -or $okmGeschuetzt -contains $okmVoll) { throw ('Dieser Ordner ist geschützt: ' + $okmVoll) }
    $okmGrenze = (Get-Date).AddDays(-{{ tage }})
    $okmDateien = @(Get-ChildItem -LiteralPath {{ pfad }} -Recurse -File -Force{% if muster %} -Filter {{ muster }}{% endif %} -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -lt $okmGrenze })
    Write-Host ($okmDateien.Count.ToString() + ' Dateien älter als ' + {{ tage }} + ' Tage gefunden.')
    $okmDateien | Select-Object -First 20 | ForEach-Object { Write-Host ('  ' + $_.FullName) }
    if ($okmDateien.Count -gt 20) { Write-Host '  …' }
    $okmDateien | Remove-Item -Force{{ whatif }}
    {{ rueckgabe_anzahl }} = $okmDateien.Count
  cmd: |
    for %%I in ({{ pfad }}) do (
      if "%%~pnxI"=="\" (
        echo Ein ganzes Laufwerk ist hier nicht erlaubt.
        cmd /c exit 1
      ) else if /i "%%~fI"=="%SystemRoot%" (
        echo Dieser Ordner ist geschützt.
        cmd /c exit 1
      ) else (
        echo Gelöscht werden Dateien älter als {{ tage }} Tage:
        forfiles /P {{ pfad }} /S{% if muster %} /M {{ muster }}{% endif %} /D -{{ tage }} /C "cmd /c if @isdir==FALSE (echo   @path & del /f /q @path)"
        cmd /c exit 0
      )
    )
  bash: &alte_sh |
    if [ ! -d {{ pfad }} ]; then
      okm_fehler 'Den Ordner gibt es nicht.'
      false
    fi
    okm_voll=$(realpath -- {{ pfad }})
    case "$okm_voll" in
      /|/bin|/boot|/dev|/etc|/home|/lib|/lib64|/opt|/proc|/root|/sbin|/srv|/sys|/usr|/var|/Users|/System|/Library|/Applications|"$HOME")
        okm_fehler "Dieser Ordner ist geschützt: $okm_voll"
        false
        ;;
    esac
    okm_liste=$(find "$okm_voll" -type f{% if muster %} -name {{ muster }}{% endif %} -mtime +{{ tage }} -print 2>/dev/null || true)
    okm_anzahl=$(printf '%s\n' "$okm_liste" | grep -c . || true)
    printf '%s Dateien älter als %s Tage gefunden.\n' "$okm_anzahl" {{ tage }}
    printf '%s\n' "$okm_liste" | head -n 20
    if [ "$okm_anzahl" -gt 20 ]; then printf '%s\n' '  …'; fi
    find "$okm_voll" -type f{% if muster %} -name {{ muster }}{% endif %} -mtime +{{ tage }} -delete 2>/dev/null || okm_warn 'Einige Dateien konnten nicht gelöscht werden.'
    {{ rueckgabe_anzahl }}=$okm_anzahl
  zsh: *alte_sh
