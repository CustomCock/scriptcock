id: paket_installieren
version: 2
name: Paket/Software installieren
kategorie: Software
beschreibung: Installiert ein Programm über den Paketmanager des Systems (Windows winget, Linux apt/dnf/Flatpak, macOS Homebrew).
hilfe: |
  Die richtige Paket-ID steht im Software-Katalog (Knopf „Software-Katalog“ bzw. Seite „Software“).
  Windows: winget-ID, z. B. Mozilla.Firefox. Linux: Paketname, z. B. firefox-esr. macOS: Homebrew-Name, z. B. firefox.
risiko: gelb
fortschritt: "{{ paket }} wird installiert"
tipp: Paket-ID im Software-Katalog prüfen. Ist das Programm schon installiert, meldet der Paketmanager ebenfalls einen Fehler.
rechte:
  bash: root
  zsh: nie_root
parameter:
  - id: paket
    label: Paketname bzw. Paket-ID
    typ: paketname
    beispiel: Mozilla.Firefox
  - id: paketmanager
    label: Paketmanager
    typ: auswahl
    standard: standard
    optionen:
      - wert: standard
        label: "Standard (Windows: winget, Linux: apt, macOS: brew)"
      - wert: winget
        label: winget (Windows)
      - wert: apt
        label: "apt (Linux: Debian, Ubuntu)"
      - wert: dnf
        label: "dnf (Linux: Fedora, RHEL, Rocky)"
      - wert: flatpak
        label: Flatpak (Linux, Flathub)
      - wert: brew
        label: brew – Formel (macOS)
      - wert: brew_cask
        label: brew --cask – App (macOS)
ziele:
  powershell: |
    winget.exe install --id {{ paket }} -e --source winget --silent --accept-package-agreements --accept-source-agreements
  cmd: |
    winget install --id {{ paket }} -e --source winget --silent --accept-package-agreements --accept-source-agreements
  bash: |
    {% if paketmanager.wert in ('winget', 'brew', 'brew_cask') %}
    printf '%s\n' 'Dieser Paketmanager ist unter Linux nicht verfügbar – bitte apt, dnf oder Flatpak wählen.'
    false
    {% elif paketmanager.wert == 'flatpak' %}
    if ! command -v flatpak >/dev/null 2>&1; then
      printf '%s\n' 'Flatpak ist nicht installiert (z. B. „apt install flatpak“, danach Flathub einrichten). Bitte an die IT wenden.'
      false
    fi
    {{ sudo }}flatpak install -y --noninteractive flathub {{ paket }}
    {% elif paketmanager.wert == 'dnf' %}
    {{ sudo }}dnf install -y {{ paket }}
    {% else %}
    {{ sudo }}apt-get update
    {{ sudo }}apt-get install -y {{ paket }}
    {% endif %}
  zsh: |
    {% if paketmanager.wert in ('winget', 'apt', 'dnf', 'flatpak') %}
    printf '%s\n' 'Dieser Paketmanager ist unter macOS nicht verfügbar – bitte brew oder brew --cask wählen.'
    false
    {% else %}
    if ! command -v brew >/dev/null 2>&1; then
      printf '%s\n' 'Homebrew ist nicht installiert (siehe https://brew.sh). Bitte an die IT wenden.'
      false
    fi
    {% if paketmanager.wert == 'brew_cask' %}
    brew install --cask {{ paket }}
    {% else %}
    brew install {{ paket }}
    {% endif %}
    {% endif %}
hinweise:
  powershell: Benötigt winget (App-Installer, ab Windows 10 1809 enthalten).
  cmd: Benötigt winget (App-Installer, ab Windows 10 1809 enthalten).
  zsh: Benötigt Homebrew. Das Script NICHT mit sudo starten – Homebrew verweigert root.
