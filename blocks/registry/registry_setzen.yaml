id: registry_setzen
version: 1
name: Registry-Wert setzen
kategorie: Registry
beschreibung: Setzt einen Wert in der Registry. Ist der Schlüssel schon da, wird er vorher automatisch gesichert (.reg im TEMP-Ordner); fehlt er, wird er angelegt.
hilfe: |
  Typ DWORD/QWORD: Daten als Zahl (z. B. 0 oder 1). Zeichenkette: beliebiger Text.
  HKCU wirkt für das Konto, unter dem das Script läuft – nach einer Rechteanforderung mit einem
  ANDEREN Admin-Konto ist das dessen Profil, nicht das des angemeldeten Benutzers.
risiko: rot
fortschritt: "Registry {{ schluessel }}: {{ wert }} wird gesetzt"
tipp: Bei Fehlern lässt sich der alte Stand mit der angezeigten .reg-Datei zurückspielen (reg import).
rechte:
  powershell: admin
  cmd: admin
parameter:
  - id: schluessel
    label: Schlüssel
    typ: registry_pfad
    beispiel: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization
  - id: wert
    label: Name des Werts
    typ: text_kurz
    beispiel: NoLockScreen
  - id: typ
    label: Typ
    typ: auswahl
    standard: dword
    optionen:
      - wert: dword
        label: DWORD (Zahl, 32 Bit)
      - wert: qword
        label: QWORD (Zahl, 64 Bit)
      - wert: string
        label: Zeichenkette (REG_SZ)
      - wert: expand_string
        label: Erweiterbare Zeichenkette (REG_EXPAND_SZ)
  - id: daten
    label: Daten
    typ: text
    beispiel: "1"
ziele:
  powershell: |
    {% if typ.wert in ('dword', 'qword') %}
    if ({{ daten }} -notmatch '^[0-9]+$') { throw 'Für DWORD/QWORD bitte eine ganze Zahl als Daten angeben.' }
    {% endif %}
    if (Test-Path -LiteralPath {{ schluessel }}) {
        $okmSicherung = Join-Path -Path $env:TEMP -ChildPath ('okm-registry-' + (Get-Date -Format 'yyyyMMdd-HHmmss') + '.reg')
        reg.exe export {{ schluessel_reg }} $okmSicherung /y | Out-Null
        if ($LASTEXITCODE -ne 0) { throw 'Die Sicherung des Schlüssels ist fehlgeschlagen – es wurde nichts geändert.' }
        Write-Host ('Sicherung: ' + $okmSicherung + ' (zurück mit: reg import <Datei>)')
    } else {
        Write-Host 'Schlüssel fehlt und wird angelegt.'
        New-Item -Path {{ schluessel }} -Force{{ whatif }} | Out-Null
    }
    {% if typ.wert == 'dword' %}
    New-ItemProperty -LiteralPath {{ schluessel }} -Name {{ wert }} -PropertyType DWord -Value ([uint32]{{ daten }}) -Force{{ whatif }} | Out-Null
    {% elif typ.wert == 'qword' %}
    New-ItemProperty -LiteralPath {{ schluessel }} -Name {{ wert }} -PropertyType QWord -Value ([uint64]{{ daten }}) -Force{{ whatif }} | Out-Null
    {% elif typ.wert == 'expand_string' %}
    New-ItemProperty -LiteralPath {{ schluessel }} -Name {{ wert }} -PropertyType ExpandString -Value {{ daten }} -Force{{ whatif }} | Out-Null
    {% else %}
    New-ItemProperty -LiteralPath {{ schluessel }} -Name {{ wert }} -PropertyType String -Value {{ daten }} -Force{{ whatif }} | Out-Null
    {% endif %}
    Write-Host ({{ wert }} + ' = ' + (Get-ItemProperty -LiteralPath {{ schluessel }} -Name {{ wert }} -ErrorAction SilentlyContinue).{{ wert }})
  cmd: |
    reg query {{ schluessel_reg }} >nul 2>&1
    if not errorlevel 1 (
      reg export {{ schluessel_reg }} "%TEMP%\okm-registry-%RANDOM%.reg" /y >nul
      if errorlevel 1 (
        echo Die Sicherung des Schlüssels ist fehlgeschlagen - es wurde nichts geändert.
        cmd /c exit 1
      ) else (
        echo Sicherung im TEMP-Ordner: okm-registry-*.reg
        reg add {{ schluessel_reg }} /v {{ wert }} /t {% if typ.wert == 'dword' %}REG_DWORD{% elif typ.wert == 'qword' %}REG_QWORD{% elif typ.wert == 'expand_string' %}REG_EXPAND_SZ{% else %}REG_SZ{% endif %} /d {{ daten }} /f
      )
    ) else (
      echo Schlüssel fehlt und wird angelegt.
      reg add {{ schluessel_reg }} /v {{ wert }} /t {% if typ.wert == 'dword' %}REG_DWORD{% elif typ.wert == 'qword' %}REG_QWORD{% elif typ.wert == 'expand_string' %}REG_EXPAND_SZ{% else %}REG_SZ{% endif %} /d {{ daten }} /f
    )
