id: registry_schluessel_anlegen
version: 1
name: Registry-Schlüssel anlegen
kategorie: Registry
beschreibung: Legt einen Schlüssel samt fehlender Elternschlüssel an, wenn es ihn noch nicht gibt. Ein vorhandener
  Schlüssel bleibt mit allen Werten unverändert.
risiko: gelb
registry: schreiben
fortschritt: 'Registry: {{ pfad }} wird angelegt'
tipp: Zugriff verweigert? Stimmt der Bereich?
rechte:
  powershell: admin
  cmd: admin
parameter:
- id: bereich
  label: Wessen Registry?
  typ: registry_bereich
  standard: computer
  hilfe: 'Computer = HKLM. Für Benutzer-Einstellungen nie HKCU direkt: nach dem Admin-Neustart wäre das das Profil
    des Admin-Kontos. Darum hier den Benutzer wählen.'
- id: pfad
  label: Schlüssel
  typ: registry_pfad
  bezug: bereich
  beispiel: HKLM\SOFTWARE\Firma\App
  hilfe: 'Computer: HKLM\…. Benutzer-Bereiche: Software\… (ohne Wurzel) oder HKCU\…. Schreibweisen wie HKLM:\… oder
    HKEY_LOCAL_MACHINE\… gehen auch.'
- id: ansicht
  label: Registry-Ansicht
  typ: auswahl
  standard: '64'
  optionen:
  - wert: '64'
    label: 64-Bit (Standard)
  - wert: '32'
    label: 32-Bit (WOW6432Node, für 32-Bit-Programme)
ziele:
  powershell: |
    New-OkmRegistrySchluessel -Bereich {{ bereich }} -Pfad {{ pfad }} -Ansicht {{ ansicht }}
  cmd: |
    {{ benutzer_anfang }}
      reg query {{ pfad_reg }} {% if ansicht.wert == '32' %}/reg:32{% else %}/reg:64{% endif %} >nul 2>&1
      if errorlevel 1 (
        reg add {{ pfad_reg }} /f {% if ansicht.wert == '32' %}/reg:32{% else %}/reg:64{% endif %}
        echo Schlüssel angelegt.
      ) else (
        echo Schlüssel ist schon vorhanden - nichts zu tun.
      )
    {{ benutzer_ende }}
dry_run:
  powershell: |
    New-OkmRegistrySchluessel -Bereich {{ bereich }} -Pfad {{ pfad }} -Ansicht {{ ansicht }} -Simulation
