id: registry_wert_lesen
version: 1
name: Registry-Wert lesen
kategorie: Registry
beschreibung: Liest einen Registry-Wert und zeigt Typ und Daten. „Nicht vorhanden“ ist ein Ergebnis, kein Fehler
  – ein späterer „Wenn“-Block kann darauf reagieren.
risiko: gruen
registry: lesen
fortschritt: 'Registry: {{ pfad }} {{ wertname }} wird gelesen'
tipp: Stimmt der Pfad (Schreibweise, 32/64-Bit-Ansicht)?
rechte:
  powershell: admin
  cmd: admin
parameter:
- id: bereich
  label: Wessen Registry?
  typ: registry_bereich
  standard: computer
  hilfe: 'Computer = HKLM. Für Benutzer-Einstellungen nie HKCU direkt: nach dem Admin-Neustart wäre das das Profil
    des Admin-Kontos. Darum hier den Benutzer wählen.'
- id: pfad
  label: Schlüssel
  typ: registry_pfad
  bezug: bereich
  beispiel: HKLM\SOFTWARE\Firma\App
  hilfe: 'Computer: HKLM\…. Benutzer-Bereiche: Software\… (ohne Wurzel) oder HKCU\…. Schreibweisen wie HKLM:\… oder
    HKEY_LOCAL_MACHINE\… gehen auch.'
- id: wertname
  label: Wertname (leer = Standardwert)
  typ: registry_wertname
  pflicht: false
- id: ansicht
  label: Registry-Ansicht
  typ: auswahl
  standard: '64'
  optionen:
  - wert: '64'
    label: 64-Bit (Standard)
  - wert: '32'
    label: 32-Bit (WOW6432Node, für 32-Bit-Programme)
rueckgabe:
- id: vorhanden
  typ: ja_nein
  beschreibung: 'Der Wert ist vorhanden (bei mehreren Profilen: überall)'
- id: wert
  typ: zahl
  beschreibung: Inhalt eines DWORD-/QWORD-Werts (nur bei einem Profil)
  ziele:
  - powershell
ziele:
  powershell: |
    $okmErgebnis = @(Get-OkmRegistryWert -Bereich {{ bereich }} -Pfad {{ pfad }} -Name {% if wertname %}{{ wertname }}{% else %}''{% endif %} -Ansicht {{ ansicht }})
    {{ rueckgabe_vorhanden }} = (@($okmErgebnis | Where-Object { $_.Wert }).Count -eq $okmErgebnis.Count)
    {{ rueckgabe_wert }} = ''
    if ($okmErgebnis.Count -eq 1 -and $okmErgebnis[0].Wert) {
        $okmArt = $okmErgebnis[0].Wert.Art
        if ($okmArt -eq [Microsoft.Win32.RegistryValueKind]::DWord -or $okmArt -eq [Microsoft.Win32.RegistryValueKind]::QWord) {
            {{ rueckgabe_wert }} = ConvertTo-OkmRegistryText $okmArt $okmErgebnis[0].Wert.Wert
        }
    }
  cmd: |
    {{ benutzer_anfang }}
      reg query {{ pfad_reg }} {% if wertname %}/v {{ wertname }}{% else %}/ve{% endif %} {% if ansicht.wert == '32' %}/reg:32{% else %}/reg:64{% endif %}
    {{ benutzer_ende }}
    if errorlevel 9 (
      cmd /c exit 1
    ) else if errorlevel 1 (
      echo Nicht vorhanden.
      set {{ rueckgabe_vorhanden }}=0
      cmd /c exit 0
    ) else (
      set {{ rueckgabe_vorhanden }}=1
    )
