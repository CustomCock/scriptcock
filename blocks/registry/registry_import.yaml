id: registry_import
version: 1
name: .reg-Datei importieren
kategorie: Registry
beschreibung: Importiert eine .reg-Datei (lokal oder vom Fileserver). Zeigt vorher, welche Schlüssel betroffen sind,
  und sichert sie (Rückgängig-Dateien).
hilfe: Abgelehnt werden Dateien mit HKEY_CURRENT_USER (das wäre nach dem Admin-Neustart das Admin-Profil) und mit
  gesperrten Bereichen (HKLM\SAM, \SECURITY, \BCD00000000).
risiko: rot
registry: import
fortschritt: 'Registry: {{ datei }} wird importiert'
tipp: Ist die Datei erreichbar und eine echte .reg-Datei (Windows Registry Editor Version 5.00)?
rechte:
  powershell: admin
  cmd: admin
parameter:
- id: datei
  label: .reg-Datei
  typ: pfad_oder_unc
  beispiel: \\fileserver\IT\Einstellungen\app.reg
- id: ansicht
  label: Registry-Ansicht
  typ: auswahl
  standard: '64'
  optionen:
  - wert: '64'
    label: 64-Bit (Standard)
  - wert: '32'
    label: 32-Bit (WOW6432Node, für 32-Bit-Programme)
- id: wirkung
  label: Wann wirkt die Änderung?
  typ: auswahl
  standard: sofort
  optionen:
  - wert: sofort
    label: sofort
  - wert: explorer_neustart
    label: nach Neustart des Explorers
  - wert: abmelden
    label: nach Ab- und Anmelden
  - wert: neustart
    label: nach Neustart des Rechners
  - wert: gpupdate
    label: nach gpupdate
  - wert: unbekannt
    label: unbekannt
vorschau:
  powershell: |
    Import-OkmRegistryDatei -Datei {{ datei }} -Ansicht {{ ansicht }} -Simulation
  cmd: |
    if not exist {{ datei }} (
      echo Die Datei gibt es nicht.
      cmd /c exit 1
    ) else (
      echo Betroffene Schlüssel:
      type {{ datei }} | findstr /b /c:"["
      type {{ datei }} | findstr /i /c:"[HKEY_CURRENT_USER" /c:"[-HKEY_CURRENT_USER" >nul
      if not errorlevel 1 (
        echo Die Datei enthält HKEY_CURRENT_USER - nach dem Admin-Neustart wäre das das Profil des Admin-Kontos.
        echo Bitte die Einstellung mit „Registry-Wert setzen“ und einem Benutzer-Bereich übernehmen.
        cmd /c exit 1
      ) else (
        type {{ datei }} | findstr /i {{ regschutz_cmd }} >nul
        if not errorlevel 1 (
          echo Die Datei schreibt in einen gesperrten Bereich der Registry.
          cmd /c exit 1
        ) else (
          cmd /c exit 0
        )
      )
    )
ziele:
  powershell: |
    Import-OkmRegistryDatei -Datei {{ datei }} -Ansicht {{ ansicht }}
    Add-OkmWirkung {{ wirkung }}
  cmd: |
    type {{ datei }} | findstr /i /c:"[HKEY_CURRENT_USER" /c:"[-HKEY_CURRENT_USER" >nul
    if not errorlevel 1 (
      echo Die Datei enthält HKEY_CURRENT_USER - nach dem Admin-Neustart wäre das das Profil des Admin-Kontos.
      echo Bitte die Einstellung mit „Registry-Wert setzen“ und einem Benutzer-Bereich übernehmen.
      cmd /c exit 1
    ) else (
      type {{ datei }} | findstr /i {{ regschutz_cmd }} >nul
      if not errorlevel 1 (
        echo Die Datei schreibt in einen gesperrten Bereich der Registry.
        cmd /c exit 1
      ) else (
        cmd /c exit 0
      )
    )
    if not errorlevel 1 (
      if not exist "%OKM_REG_SICHERUNG%\" mkdir "%OKM_REG_SICHERUNG%"
      type {{ datei }} | findstr /n /b /c:"[" > "%TEMP%\okm-import-%OKM_TS%.txt"
      for /f "usebackq tokens=1* delims=:" %%a in ("%TEMP%\okm-import-%OKM_TS%.txt") do for /f "tokens=* delims=[-" %%c in ("%%b") do for /f "delims=]" %%d in ("%%c") do reg export "%%d" "%OKM_REG_SICHERUNG%\import-%%a.reg" /y {% if ansicht.wert == '32' %}/reg:32{% else %}/reg:64{% endif %} >nul 2>&1
      del "%TEMP%\okm-import-%OKM_TS%.txt" >nul 2>&1
      reg import {{ datei }} {% if ansicht.wert == '32' %}/reg:32{% else %}/reg:64{% endif %}
    )
    {% if wirkung.wert == 'unbekannt' %}if not errorlevel 1 set OKM_WIRKUNG_UNBEKANNT=1{% else %}if not errorlevel 1 if {{ wirkung_rang }} GTR %OKM_WIRKUNG% set OKM_WIRKUNG={{ wirkung_rang }}{% endif %}
dry_run:
  powershell: |
    Import-OkmRegistryDatei -Datei {{ datei }} -Ansicht {{ ansicht }} -Simulation
