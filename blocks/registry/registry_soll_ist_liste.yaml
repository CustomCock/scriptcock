id: registry_soll_ist_liste
version: 1
name: Registry-Werte prüfen (Soll/Ist-Liste)
kategorie: Registry
beschreibung: Vergleicht mehrere Registry-Werte mit ihrem Soll und meldet je Wert OK oder ABWEICHUNG, am Ende die Anzahl der Abweichungen. Ändert nichts.
hilfe: |
  Eine Zeile pro Wert: Pfad ; Wertname ; Typ ; Soll – z. B.
  HKLM\SOFTWARE\Policies\Microsoft\Edge ; HomepageLocation ; REG_SZ ; https://intranet
  Wertname leer = Standardwert. REG_MULTI_SZ bitte einzeln mit „Registry-Wert prüfen“.
  In Blockly die Werte mit | trennen. Für einen Bericht danach „Bericht als HTML speichern“ anhängen.
risiko: gruen
registry: lesen
fortschritt: "Registry: Soll/Ist-Vergleich"
tipp: Stimmen die Pfade, und passt der Bereich (Computer oder Benutzer) zu allen Zeilen?
rechte:
  powershell: admin
parameter:
  - id: bereich
    label: Wessen Registry?
    typ: registry_bereich
    standard: computer
    hilfe: Gilt für alle Zeilen. Computer = HKLM\…; Benutzer-Bereiche = Software\… bzw. HKCU\….
  - id: eintraege
    label: Werte (eine Zeile pro Wert)
    typ: registry_soll_liste
    beispiel: HKLM\SOFTWARE\Policies\Microsoft\Edge ; HomepageLocation ; REG_SZ ; https://intranet.okm.local
  - id: ansicht
    label: Registry-Ansicht
    typ: auswahl
    standard: '64'
    optionen:
      - wert: '64'
        label: 64-Bit (Standard)
      - wert: '32'
        label: 32-Bit (WOW6432Node, für 32-Bit-Programme)
  - id: abbrechen
    label: Script abbrechen, wenn etwas abweicht
    typ: ja_nein
    pflicht: false
    standard: false
rueckgabe:
  - id: abweichungen
    typ: zahl
    beschreibung: Anzahl der Werte, die nicht dem Soll entsprechen
ziele:
  powershell: |
    {{ rueckgabe_abweichungen }} = 0
    foreach ($okmEintrag in {{ eintraege }}) {
        # Pfad|Wertname|Typ|Soll – geprüft beim Erzeugen, das Soll darf | enthalten
        $okmTeile = $okmEintrag -split '\|', 4
        if (-not (Test-OkmRegistryWert -Bereich {{ bereich }} -Pfad $okmTeile[0] -Name $okmTeile[1] -Typ $okmTeile[2] -Daten $okmTeile[3] -Ansicht {{ ansicht }})) {
            {{ rueckgabe_abweichungen }}++
        }
    }
    if ({{ rueckgabe_abweichungen }} -gt 0) {
        Write-OkmWarnung ('Abweichungen: ' + {{ rueckgabe_abweichungen }} + ' von ' + @({{ eintraege }}).Count + ' Werten')
    {% if abbrechen %}
        throw 'Nicht alle Registry-Werte entsprechen dem Soll.'
    {% endif %}
    } else {
        Write-OkmOk ('Alle ' + @({{ eintraege }}).Count + ' Werte entsprechen dem Soll.')
    }
