id: linux_upgrade
version: 1
name: "Linux: Updates installieren"
kategorie: Updates
beschreibung: Aktualisiert die Paketquellen und installiert alle verfügbaren Updates (apt oder dnf, automatisch erkannt).
risiko: gelb
fortschritt: Linux-Updates werden installiert
rechte:
  bash: root
ziele:
  bash: |
    if command -v apt-get >/dev/null 2>&1; then
      {{ sudo }}apt-get update
      {{ sudo }}env DEBIAN_FRONTEND=noninteractive apt-get -y upgrade
    elif command -v dnf >/dev/null 2>&1; then
      {{ sudo }}dnf -y upgrade
    else
      printf '%s\n' 'Kein unterstützter Paketmanager (apt, dnf) gefunden.'
      false
    fi
    if [ -f /var/run/reboot-required ]; then printf '%s\n' 'Ein Neustart ist erforderlich.'; fi
