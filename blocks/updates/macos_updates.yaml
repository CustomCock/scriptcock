id: macos_updates
version: 1
name: "macOS: Softwareupdates installieren"
kategorie: Updates
beschreibung: Installiert alle verfügbaren macOS-Softwareupdates. Neu gestartet wird nicht automatisch.
risiko: gelb
fortschritt: macOS-Updates werden installiert
rechte:
  zsh: root
ziele:
  zsh: |
    {{ sudo }}softwareupdate --install --all
