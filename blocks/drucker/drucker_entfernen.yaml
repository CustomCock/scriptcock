id: drucker_entfernen
version: 1
name: Drucker entfernen
kategorie: Drucker
beschreibung: Entfernt einen eingerichteten Drucker.
risiko: gelb
fortschritt: "Drucker {{ name }} wird entfernt"
rechte:
  bash: root
  zsh: root
parameter:
  - id: name
    label: Druckername
    typ: text_kurz
    beispiel: Drucker-Empfang
ziele:
  powershell: |
    Remove-Printer -Name {{ name }}{{ whatif }}
  cmd: |
    rundll32 printui.dll,PrintUIEntry /dl /n {{ name }}
  bash: |
    {{ sudo }}lpadmin -x {{ name }}
  zsh: |
    {{ sudo }}lpadmin -x {{ name }}
