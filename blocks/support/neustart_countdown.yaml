id: neustart_countdown
version: 1
name: Neustart mit Vorwarnung
kategorie: Support
beschreibung: Plant einen Neustart in der angegebenen Zeit und zeigt dem Benutzer eine Meldung. Nicht gespeicherte Arbeit geht verloren.
hilfe: |
  Windows: Abbrechen mit „shutdown /a“. Linux: „shutdown -c“. Für macOS gibt es diesen Baustein nicht.
risiko: rot
admin_noetig:
  bash: true
fortschritt: "Neustart in {{ minuten }} Minuten wird geplant"
parameter:
  - id: minuten
    label: Neustart in (Minuten)
    typ: zahl
    min: 1
    max: 1440
    standard: 10
  - id: meldung
    label: Meldung an den Benutzer
    typ: text
    standard: Der Rechner wird für Wartungsarbeiten neu gestartet. Bitte alles speichern.
ziele:
  powershell: |
    shutdown.exe /r /t ({{ minuten }} * 60) /c {{ meldung }}
  cmd: |
    set /a OKM_SEKUNDEN={{ minuten }}*60
    shutdown /r /t %OKM_SEKUNDEN% /c {{ meldung }}
  bash: |
    shutdown -r +{{ minuten }} {{ meldung }}
