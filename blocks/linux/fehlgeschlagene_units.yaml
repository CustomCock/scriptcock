id: fehlgeschlagene_units
version: 1
name: "Linux: Fehlgeschlagene Dienste"
kategorie: Linux-Server
beschreibung: Listet alle systemd-Dienste im Zustand „failed“ mit den letzten Protokollzeilen.
risiko: gruen
fortschritt: Fehlgeschlagene Dienste werden gesucht
ziele:
  bash: |
    okm_units="$(systemctl --failed --no-legend --plain | awk '{print $1}')"
    if [ -z "$okm_units" ]; then
      printf '%s\n' 'Keine fehlgeschlagenen Dienste.'
    else
      for okm_unit in $okm_units; do
        printf '\n== %s ==\n' "$okm_unit"
        journalctl -u "$okm_unit" -n 10 --no-pager || true
      done
    fi
