id: docker_uebersicht
version: 1
name: "Linux: Docker-Übersicht"
kategorie: Linux-Server
beschreibung: Zeigt laufende und gestoppte Container, deren Ressourcenverbrauch und den belegten Speicherplatz.
risiko: gruen
fortschritt: Docker-Übersicht wird erstellt
rechte:
  bash: root
ziele:
  bash: |
    if ! command -v docker >/dev/null 2>&1; then
      printf '%s\n' 'Docker ist nicht installiert.'
    else
      {{ sudo }}docker ps -a
      printf '\n'
      {{ sudo }}docker stats --no-stream
      printf '\n'
      {{ sudo }}docker system df
    fi
