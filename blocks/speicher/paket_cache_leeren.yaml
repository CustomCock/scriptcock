id: paket_cache_leeren
version: 1
name: Paket-Cache leeren
kategorie: Speicher
beschreibung: Löscht heruntergeladene Installationspakete (apt/dnf bzw. Homebrew), die nicht mehr gebraucht werden.
risiko: gelb
fortschritt: Paket-Cache wird geleert
rechte:
  bash: root
  zsh: nie_root
ziele:
  bash: |
    if command -v apt-get >/dev/null 2>&1; then
      {{ sudo }}apt-get clean
      {{ sudo }}apt-get -y autoremove
    elif command -v dnf >/dev/null 2>&1; then
      {{ sudo }}dnf clean all
    else
      printf '%s\n' 'Kein unterstützter Paketmanager gefunden.'
    fi
  zsh: |
    if command -v brew >/dev/null 2>&1; then
      brew cleanup
    else
      printf '%s\n' 'Homebrew ist nicht installiert – nichts zu tun.'
    fi
hinweise:
  zsh: Homebrew verweigert root – das Script NICHT mit sudo starten.
