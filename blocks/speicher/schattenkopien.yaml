id: schattenkopien
version: 1
name: Schattenkopien anzeigen
kategorie: Speicher
beschreibung: Listet die vorhandenen Schattenkopien (Volumenschattenkopien) auf.
risiko: gruen
admin_noetig: true
fortschritt: Schattenkopien werden aufgelistet
ziele:
  powershell: |
    vssadmin.exe list shadows
    if ($LASTEXITCODE -ne 0) { Write-Host 'Keine Schattenkopien vorhanden.'; $global:LASTEXITCODE = 0 }
  cmd: |
    vssadmin list shadows
    cmd /c exit 0
