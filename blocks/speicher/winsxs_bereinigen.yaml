id: winsxs_bereinigen
version: 1
name: Komponentenspeicher (WinSxS) bereinigen
kategorie: Speicher
beschreibung: Entfernt veraltete Update-Komponenten aus dem Windows-Komponentenspeicher und schafft Platz.
hilfe: |
  Danach lassen sich bereits installierte Updates nicht mehr deinstallieren. Dauert einige Minuten.
risiko: gelb
fortschritt: Komponentenspeicher wird bereinigt
rechte:
  powershell: admin
  cmd: admin
ziele:
  powershell: |
    DISM.exe /Online /Cleanup-Image /StartComponentCleanup
  cmd: |
    DISM /Online /Cleanup-Image /StartComponentCleanup
