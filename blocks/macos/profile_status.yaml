id: profile_status
version: 1
name: "macOS: MDM- und Konfigurationsprofile"
kategorie: macOS
beschreibung: Zeigt, ob der Mac in einer Geräteverwaltung (MDM) angemeldet ist und welche Profile installiert sind.
risiko: gruen
fortschritt: Profile werden gelesen
rechte:
  zsh: root
ziele:
  zsh: |
    {{ sudo }}profiles status -type enrollment
    {{ sudo }}profiles list
