id: rosetta_installieren
version: 1
name: "macOS: Rosetta 2 installieren"
kategorie: macOS
beschreibung: Installiert Rosetta 2, damit Intel-Programme auf Macs mit Apple-Chip laufen.
risiko: gelb
admin_noetig: true
fortschritt: Rosetta 2 wird installiert
ziele:
  zsh: |
    if [ "$(uname -m)" != "arm64" ]; then
      printf '%s\n' 'Kein Apple-Chip – Rosetta wird nicht benötigt.'
    else
      softwareupdate --install-rosetta --agree-to-license
    fi
