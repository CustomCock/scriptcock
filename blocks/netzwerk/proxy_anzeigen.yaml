id: proxy_anzeigen
version: 1
name: Proxy-Einstellungen anzeigen
kategorie: Netzwerk
beschreibung: Zeigt die Proxy-Einstellungen des Benutzers und des Systems.
risiko: gruen
fortschritt: Proxy-Einstellungen werden gelesen
ziele:
  powershell: |
    Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' |
        Format-List ProxyEnable, ProxyServer, ProxyOverride, AutoConfigURL
    netsh.exe winhttp show proxy
  cmd: |
    reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings" /v ProxyEnable
    reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings" /v ProxyServer 2>nul
    netsh winhttp show proxy
  zsh: |
    scutil --proxy
